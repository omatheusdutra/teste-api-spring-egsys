spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/egsys_tasks
    username: egsys_app
    password: ${EGSYS_DB_PASSWORD:egsys_local_password}
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: false

logging:
  level:
    br.com.egsys.tasks: INFO
