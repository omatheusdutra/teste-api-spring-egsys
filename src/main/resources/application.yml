spring:
  application:
    name: teste-api-spring-egsys
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  datasource:
    hikari:
      maximum-pool-size: 9
      minimum-idle: 2
      pool-name: egsys-tasks-hikari
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript
  error:
    whitelabel:
      enabled: false
  max-http-request-header-size: 16KB
  server-header:

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${EGSYS_TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

egsys:
  security:
    allowed-origins: []
    jwt:
      issuer: egsys-tasks-api
      audience: egsys-tasks-clients
      access-token-ttl: 15m
      refresh-token-ttl: 7d
