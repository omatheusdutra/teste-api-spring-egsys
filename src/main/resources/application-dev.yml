spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/egsys_tasks
    username: egsys_app
    password: ${EGSYS_DB_PASSWORD:egsys_local_password}
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    br.com.egsys.tasks: INFO

egsys:
  playground:
    enabled: true
    attack-demos-enabled: true
    metrics-enabled: true
