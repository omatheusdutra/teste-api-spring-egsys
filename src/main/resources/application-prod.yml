spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${EGSYS_DB_HOST}:${EGSYS_DB_PORT:5432}/${EGSYS_DB_NAME}
    username: ${EGSYS_DB_USERNAME}
    password: ${EGSYS_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${EGSYS_DB_POOL_MAX:3}
      minimum-idle: ${EGSYS_DB_POOL_MIN:1}
  data:
    redis:
      url: ${EGSYS_REDIS_URL}
  jpa:
    hibernate:
      ddl-auto: validate

egsys:
  playground:
    enabled: true
    attack-demos-enabled: false
    metrics-enabled: false
  security:
    allowed-origins: ${EGSYS_ALLOWED_ORIGINS}
    password-pepper: ${EGSYS_PASSWORD_PEPPER}
    jwt:
      private-key: ${EGSYS_JWT_PRIVATE_KEY}
      public-key: ${EGSYS_JWT_PUBLIC_KEY}

logging:
  level:
    root: INFO
    br.com.egsys.tasks: INFO

management:
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  tracing:
    sampling:
      probability: ${EGSYS_TRACING_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
