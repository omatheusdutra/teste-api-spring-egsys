global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: teste-api-spring-egsys
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /etc/prometheus/secrets/api-token.example
    static_configs:
      - targets: ["teste-api-spring-egsys:8080"]
